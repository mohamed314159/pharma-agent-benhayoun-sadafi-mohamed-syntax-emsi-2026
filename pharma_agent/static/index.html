<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pharma Research Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1b1f24; --muted:#5f6b7a; --border:#e3e6ea; --accent:#1f5fd6; --soft:#e8f0fe; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --panel:#171b21; --text:#e6e9ee; --muted:#98a2b0; --border:#2a3039; --accent:#6ea2ff; --soft:#1c2a44; --warn:#d4a72c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui, "Segoe UI", sans-serif; }
  main { max-width:900px; margin:0 auto; padding:24px 16px 48px; }
  h1 { margin:0; font-size:20px; } .muted { color:var(--muted); font-size:13px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-top:16px; }
  form { display:flex; gap:8px; }
  textarea { flex:1; min-height:52px; padding:10px; font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:8px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:0 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  .chip { background:var(--soft); color:var(--accent); padding:4px 10px; margin:8px 6px 0 0; font-size:12.5px; border-radius:999px; font-weight:500; }
  table { border-collapse:collapse; display:block; overflow-x:auto; } th, td { border:1px solid var(--border); padding:6px 8px; vertical-align:top; }
  details { margin-top:8px; } summary { cursor:pointer; font-weight:600; }
  .sub { border-left:3px solid var(--accent); padding-left:12px; margin:14px 0; }
  .chunk { font-size:12.5px; color:var(--muted); border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin:4px 0; white-space:pre-wrap; }
  .issue { color:var(--warn); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>💊 Pharma Research Agent</h1>
  <div class="muted">Decompose → route → DailyMed / MedlinePlus / glossary agents → comparator → synthesizer. Not medical advice.</div>
  <div class="panel">
    <form id="form"><textarea id="q" placeholder="Ask about warfarin, apixaban, metformin, sertraline, ibuprofen…" required></textarea><button id="go">Ask</button></form>
    <div id="chips"></div>
  </div>
  <div class="panel" id="out"><span class="muted">The answer will appear here, with its sources and the details of each step.</span></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => window.marked ? DOMPurify.sanitize(marked.parse(s)) : `<pre>${esc(s)}</pre>`;
["What are the main contraindications for warfarin?",
 "Compare the contraindications of warfarin and apixaban. What conditions are shared and which are unique to each drug?",
 "A patient currently on warfarin is prescribed sertraline. What is the risk of bleeding and what monitoring is recommended?",
 "A patient with an eGFR of 25 mL/min is being considered for metformin. Is metformin contraindicated, and what is the threshold?"]
.forEach(q => { const b = document.createElement("button"); b.className = "chip"; b.type = "button";
  b.textContent = q.length > 55 ? q.slice(0, 52) + "…" : q; b.onclick = () => { $("q").value = q; $("form").requestSubmit(); }; $("chips").append(b); });

function details(subs) {
  return subs.map((s, i) => `<div class="sub"><b>Sub-question ${i + 1}:</b> ${esc(s.question)}
    <div class="muted">Routes: ${s.routes.map(r => `${esc(r.route)} (${r.confidence})`).join(", ")}</div>
    ${Object.entries(s.agents).map(([route, a]) => `<details><summary>${esc(route)} agent — answer and ${a.chunks.length} chunks</summary>
      <div>${md(a.answer)}</div>${a.chunks.map(c => `<div class="chunk"><b>${esc(c.file)} › ${esc(c.section)}</b> — ${esc(c.title)} · reranker ${c.rerank_score}/10\n${esc(c.text)}</div>`).join("")}</details>`).join("")}
    <div><b>Comparator:</b> kept ${esc((s.review.kept || []).join(", ") || "—")}${s.review.contradiction ? " · contradiction detected" : ""}</div>
    ${(s.review.issues || []).map(x => `<div class="issue">⚠️ ${esc(x.type)}: ${esc(x.claim)} — ${esc(x.detail)}</div>`).join("")}</div>`).join("");
}

$("form").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("out").innerHTML = '<span class="muted">Decomposing the question, querying the agents, comparing the answers… (≈ 20–40 s)</span>';
  try {
    const r = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: $("q").value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.status);
    $("out").innerHTML = md(d.answer)
      + `<details><summary>Sources (${d.sources.length})</summary>${d.sources.map(s => `<div class="chunk"><b>${esc(s.file)} › ${esc(s.section)}</b> — ${esc(s.title)}</div>`).join("")}</details>`
      + `<details><summary>See details (${d.details.length} sub-question(s), ${d.latency_s} s)</summary>${details(d.details)}</details>`;
  } catch (err) { $("out").innerHTML = `<span class="issue">Error: ${esc(err.message)}</span>`; }
  $("go").disabled = false;
};
$("q").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
</script>
</body>
</html>
